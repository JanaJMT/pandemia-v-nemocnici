<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pandémia v nemocnici</title><style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:#061924;color:#f5fbfd}button,input{font:inherit}.top{padding:10px 18px;background:#03131ded;display:flex;gap:12px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:8}.brand,.ey{color:#76e9e5;font-weight:800}.hud{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.exit{background:#762b3a;color:white;border:1px solid #ff8293;border-radius:10px;padding:8px 12px;cursor:pointer}.wrap{min-height:calc(100vh - 55px);background-size:cover;background-position:center;position:relative}.wrap:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#021018f2,#021018ca 58%,#02101872)}.content{position:relative;max-width:1160px;margin:auto;padding:34px}.card,.side{background:#092737ed;border:1px solid #3d7488;border-radius:20px;padding:24px;box-shadow:0 15px 45px #0007}.case{color:#ffc857;font-weight:800;text-transform:uppercase;margin:12px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.ans,.btn{border:1px solid #4f8398;border-radius:13px;padding:14px;background:#123e52;color:white;cursor:pointer;font-weight:700}.btn{background:#21c8c7;color:#04212b}.danger{background:#ff5d73}.muted{color:#b9ccd4}.grid{display:grid;grid-template-columns:1fr 330px;gap:22px}.clues{max-height:420px;overflow:auto;padding-left:20px}.clues li{margin:8px 0}.locked{color:#627d88}.modal{position:fixed;inset:0;background:#000d;display:grid;place-items:center;z-index:30;padding:20px}.modal>div{max-width:700px;background:#0a2939;border:1px solid #4f8398;border-radius:18px;padding:28px}.progress{height:7px;background:#23424f}.progress i{display:block;height:100%;background:#42d39b}.setup{display:grid;gap:14px;max-width:720px}.field{display:grid;gap:6px}.field input{padding:12px;border-radius:10px;border:1px solid #5a8da0;background:#061924;color:white}.modes,.reportgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mode{padding:18px;border:2px solid #426f80;border-radius:15px;background:#0d3345;cursor:pointer}.mode.selected{border-color:#21c8c7;background:#12485d}.hidden{display:none!important}.score{font-size:2.2rem;color:#76e9e5;font-weight:800}.hint{padding:12px;border-left:4px solid #21c8c7;background:#082432}.cluebox{border:2px solid #21c8c7;background:#0d3d4d;padding:18px;border-radius:14px}.brief{background:#0b3042;border-radius:14px;padding:16px;line-height:1.55}.reportline{background:#082432;padding:14px;border-radius:12px}.stamp{display:inline-block;padding:9px 14px;border:2px solid #42d39b;color:#42d39b;font-weight:900}@media(max-width:850px){.grid,.answers,.modes,.reportgrid{grid-template-columns:1fr}}</style></head><body><div class="top"><span class="brand">PANDÉMIA V NEMOCNICI</span><div class="hud"><span id="status"></span><span id="lives"></span><button id="exitBtn" class="exit hidden" onclick="exitGame()">🚪 Stiahnuť priebežný výsledok</button></div></div><div class="progress"><i id="bar"></i></div><main id="app" class="wrap"><div id="content" class="content"></div></main><script>const IM={"hospital": "hospital.webp", "lab": "laboratory.webp", "final": "finale.webp"},BANK=[["Príjem", "Ranný skríning po výpadku systému", "Na urgentnom príjme prestal fungovať elektronický záznam. Sestra zapisuje výsledky na papier. Za bežné hodnoty v modelovej úlohe považuje teploty od 36 °C do 37,2 °C vrátane oboch krajných hodnôt. Ktorý interval má napísať na triediaci hárok?", ["(36 ; 37,2)", "⟨36 ; 37,2⟩", "⟨36 ; 37,2)", "(36 ; 37,2⟩"], 1, "Epidemiologický tím vylúčil chirurgické oddelenie."], ["Odberová miestnosť", "Kontrola vzoriek po reštarte analyzátora", "Po reštarte analyzátora zostal nastavený modelový filter (3,9 ; 5,5). Hodnoty 3,9 a 5,5 do filtra nepatria. Ktorý zoznam obsahuje iba hodnoty, ktoré do tohto intervalu patria?", ["3,9; 4,0; 4,6; 5,5", "4,0; 4,6; 5,1", "3,8; 4,0; 5,1", "4,0; 5,1; 5,5"], 1, "Prvý spoločný bod pacientov bol na prízemí nemocnice."], ["Ambulancia", "Výber transportnej vesty", "Na presun pacientov sú pripravené transportné vesty. Model M je určený pre hmotnosť od 45 kg vrátane do 60 kg, pričom 60 kg už do rozsahu nepatrí. Adam váži 44,9 kg, Boris 45 kg, Erika 54,5 kg a Filip 60 kg. Komu vesta M vyhovuje?", ["Adamovi, Borisovi a Erike", "Borisovi a Erike", "Borisovi, Erike a Filipovi", "Erike a Filipovi"], 1, "Pacient NULA nebol zamestnanec nemocnice."], ["JIS", "Nastavenie hranice cvičného monitora", "Technik obnovuje cvičné nastavenie monitora. Za bezpečné sú v tejto úlohe označené hodnoty 95 a vyššie. Hodnota 95 teda do bezpečného rozsahu patrí. Ktorý interval má technik nastaviť?", ["(95 ; +∞)", "⟨95 ; +∞)", "(−∞ ; 95⟩", "(−∞ ; 95)"], 1, "Nákazu nespôsobilo jedlo."], ["Interné oddelenie", "Prepojenie dvoch zoznamov pacientov", "Prvý nemocničný zoznam obsahuje modelové hodnoty ⟨100 ; 140⟩. Druhý zoznam pracuje s intervalom (120 ; 150). Vyšetrovateľ potrebuje zobraziť iba záznamy, ktoré patria do oboch zoznamov súčasne. Ktorý interval dostane?", ["⟨100 ; 150)", "(120 ; 140⟩", "⟨120 ; 140⟩", "(100 ; 150)"], 1, "Zdrojom nákazy bola voda."], ["Čakáreň", "Kontrola prevádzky výdajníka vody", "Z technického denníka vyplýva, že výdajník vody bol dostupný ráno od 6:00 do 8:00 vrátane a večer od 18:00 do 20:00 vrátane. Ktorý zápis obsahuje všetky časy, keď sa z neho dalo čerpať?", ["⟨6 ; 20⟩", "⟨6 ; 8⟩ ∩ ⟨18 ; 20⟩", "⟨6 ; 8⟩ ∪ ⟨18 ; 20⟩", "(8 ; 18)"], 2, "Podozrivým zariadením bol automat na vodu v čakárni."], ["Monitoring", "Overenie chybného automatického hlásenia", "Monitorovací systém používa modelový interval ⟨60 ; 100⟩. Technik kontroluje štyri automatické hlásenia. Ktoré hlásenie je chybné?", ["Hodnota 60 patrí do intervalu.", "Hodnota 100 patrí do intervalu.", "Hodnota 59,9 patrí do intervalu.", "Hodnota 76 patrí do intervalu."], 2, "Kamera zachytila podozrivý pohyb vo večerných hodinách."], ["Laboratórium", "Spojenie kamerového a vstupného záznamu", "Kamera zaznamenala pohyb pri automate v čase ⟨18 ; 20⟩. Elektronický vstup pacienta eviduje prítomnosť v čase ⟨19 ; 21⟩. V ktorom intervale mohli platiť oba záznamy súčasne?", ["⟨18 ; 21⟩", "⟨19 ; 20⟩", "⟨18 ; 19⟩", "⟨20 ; 21⟩"], 1, "Rozhodujúci kontakt sa odohral medzi 19:00 a 20:00."], ["Nočná služba", "Zápis služby cez polnoc", "Služba začala o 18:00 a skončila o 6:00 nasledujúceho dňa. Jeden deň zobrazujeme intervalom ⟨0 ; 24⟩. Ktorý zápis zachytí celú službu?", ["⟨6 ; 18⟩", "⟨18 ; 24⟩ ∪ ⟨0 ; 6⟩", "⟨18 ; 6⟩", "⟨0 ; 24⟩"], 1, "Pacient NULA prišiel počas večernej služby."], ["Bezpečnostná miestnosť", "Porovnanie posledných záznamov", "Vyšetrovací tím vie, že hľadaná osoba nebola zamestnancom a pri automate bola medzi 19:00 a 20:00. Kamera zachytila: A – sestra 19:10, B – návštevník 17:50, C – pacient 19:25, D – lekár 19:40. Ktorá osoba spĺňa obe podmienky?", ["osoba A", "osoba B", "osoba C", "osoba D"], 2, "Kamerový záznam označil pacienta C o 19:25."]],RESCUE=[["Ktorý zápis znamená „najmenej 5“?", ["(5 ; +∞)", "⟨5 ; +∞)", "(−∞ ; 5⟩"], 1], ["Patrí číslo 2 do intervalu (2 ; 9)?", ["áno", "nie"], 1], ["Ktorý slovný opis znamená x ≤ 12?", ["menej ako 12", "najviac 12", "najmenej 12"], 1], ["Ktoré z čísel do intervalu ⟨2 ; 6) nepatrí?", ["2", "5,9", "6"], 2], ["V ktorom intervale číslo 1 patrí a číslo 4 nepatrí?", ["(1 ; 4)", "⟨1 ; 4⟩", "⟨1 ; 4)"], 2]],KEY='pandemiaStoryRebuilt';let S=load();function fresh(){return{view:'setup',name:'',mode:'training',teacher:'',order:[],p:0,l:3,correct:0,wrong:0,start:0,clues:[],rescue:[],rp:0,final:0}}function load(){try{return Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY))||{})}catch(e){return fresh()}}function save(){localStorage.setItem(KEY,JSON.stringify(S));hud()}function sh(a){a=a.slice();for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function hud(){let a=S.view!=='setup';status.textContent=a?'Misia '+Math.min(S.p,10)+'/10 • dôkazy '+S.clues.length+'/10':'';lives.textContent=a?S.name+(S.mode==='sharp'?' • 🩺 '+S.l:''):'';exitBtn.classList.toggle('hidden',!a);bar.style.width=Math.min(100,S.p*10)+'%'}function render(){hud();app.style.backgroundImage='url("'+(S.view==='final'?IM.lab:S.view==='win'?IM.final:IM.hospital)+'")';({setup,intro,game,rescue,final:finale,win}[S.view]||setup)()}function setup(){content.innerHTML='<div class="ey">INTERAKTÍVNE VYŠETROVANIE</div><h1>Pandémia v nemocnici</h1><div class="card setup"><div class="brief"><b>Príbeh:</b> Po večernej službe sa u viacerých ľudí objavili rovnaké ťažkosti. Krízový tím potrebuje zistiť, kto bol pacient NULA, kde vznikol spoločný kontakt a ktorý záznam prípad potvrdzuje.<br><br><b>Ako sa hrá:</b> Vyrieš desať modelových zdravotníckych situácií s intervalmi. Každá správna odpoveď odomkne dôkaz. Vo finále z dôkazov zostavíš záverečnú správu.</div><label class="field">Meno a priezvisko<input id="nm"></label><div class="modes"><div class="mode '+(S.mode==='training'?'selected':'')+'" onclick="choose(\'training\')"><b>Tréning</b><p>Bez straty životov.</p></div><div class="mode '+(S.mode==='sharp'?'selected':'')+'" onclick="choose(\'sharp\')"><b>Ostrá služba</b><p>Tri životy a resuscitácia.</p></div></div><label class="field '+(S.mode==='sharp'?'':'hidden')+'">E-mail učiteľa<input id="te" type="email" value="'+(S.teacher||'')+'"></label><button class="btn" onclick="begin()">Prevziať vyšetrovanie</button></div>'}function choose(m){S.mode=m;render()}function begin(){if(!nm.value.trim())return alert('Zadaj meno.');S.name=nm.value.trim();if(S.mode==='sharp'){S.teacher=te.value.trim();if(!/^\S+@\S+\.\S+$/.test(S.teacher))return alert('Zadaj platný e-mail.')}S.order=sh([...Array(10).keys()]);S.p=0;S.l=3;S.correct=S.wrong=0;S.clues=[];S.final=0;S.start=Date.now();S.view='intro';save();render()}function intro(){content.innerHTML='<div class="ey">HLÁSENIE KRÍZOVÉHO TÍMU</div><h1>Vyšetrovanie bolo pridelené: '+S.name+'</h1><div class="card"><p>Záznamy sú neúplné a poradie misií je náhodné. Matematické riešenie odomkne dôkaz.</p><button class="btn" onclick="S.view=\'game\';save();render()">Otvoriť prvý spis</button></div>'}function opts(o,f){return'<div class="answers">'+o.map((x,i)=>'<button class="ans" onclick="'+f+'('+i+')"><b>'+String.fromCharCode(65+i)+'</b> '+x+'</button>').join('')+'</div>'}function game(){let q=BANK[S.order[S.p]];content.innerHTML='<div class="grid"><div><div class="ey">'+q[0].toUpperCase()+' • MISIA '+(S.p+1)+'/10</div><div class="card"><div class="case">'+q[1]+'</div><h2>'+q[2]+'</h2>'+opts(q[3],'answer')+'</div></div><aside class="side"><b>🔎 Vyšetrovací spis</b><ol class="clues">'+[...Array(10)].map((_,i)=>S.clues[i]?'<li>✅ '+S.clues[i]+'</li>':'<li class="locked">⬜ Dôkaz '+(i+1)+'</li>').join('')+'</ol></aside></div>'}function answer(a){let q=BANK[S.order[S.p]];if(a===q[4]){S.correct++;S.p++;S.clues.push(q[5]);save();modal('DÔKAZ ZAISTENÝ',q[5],()=>{S.view=S.p===10?'final':'game';save();render()})}else{S.wrong++;if(S.mode==='training')modal('Záznam nesedí','Skontroluj krajné hodnoty a skús znova.',render);else{S.l--;save();if(S.l<=0){S.rescue=sh(RESCUE).slice(0,3);S.rp=0;S.view='rescue';render()}else modal('Nesprávne rozhodnutie','Strácaš jeden život.',render)}}}function rescue(){let q=S.rescue[S.rp];content.innerHTML='<div class="card"><div class="ey">RESUSCITÁCIA '+(S.rp+1)+'/3</div><h2>'+q[0]+'</h2>'+opts(q[1],'resAns')+'</div>'}function resAns(a){let q=S.rescue[S.rp];if(a===q[2]){S.rp++;if(S.rp===3){S.l=1;S.view='game'}save();render()}else{S.rescue=sh(RESCUE).slice(0,3);S.rp=0;S.wrong++;save();render()}}const F=[['Ktorá osoba spĺňa všetky podmienky?',['sestra A','návštevník B','pacient C','lekár D'],2],['Ktoré miesto spája pacientov?',['chirurgia','lekáreň','automat na vodu v čakárni','interné'],2],['Ktorý záznam uzatvára časovú os?',['ranná vizita','kamera: pacient C o 19:25','výdaj liekov','obed'],1]];function finale(){let q=F[S.final];content.innerHTML='<div class="grid"><div class="card"><div class="ey">ZÁVEREČNÁ SPRÁVA '+(S.final+1)+'/3</div><h1>'+q[0]+'</h1>'+opts(q[1],'fin')+'</div><aside class="side"><b>Dôkazy</b><ol class="clues">'+S.clues.map(x=>'<li>✅ '+x+'</li>').join('')+'</ol></aside></div>'}function fin(a){let q=F[S.final];if(a===q[2]){S.correct++;S.final++;S.view=S.final===3?'win':'final';save();render()}else{S.wrong++;modal('Záver nesedí','Skontroluj dôkazy.',render)}}function elapsed(){return Math.max(1,Math.round((Date.now()-S.start)/60000))}function report(){return'Pandémia v nemocnici\nŽiak: '+S.name+'\nSprávne: '+S.correct+'\nChyby: '+S.wrong+'\nDôkazy: '+S.clues.length+'/10\nČas: '+elapsed()+' min\nZáver: pacient C, automat na vodu, 19:25'}function download(){let b=new Blob([report()],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='vysledok_'+S.name.replace(/\s+/g,'_')+'.txt';a.click()}function exitGame(){download()}function win(){let pct=Math.round(S.correct/13*100);content.innerHTML='<div class="card"><div class="ey">ZÁVEREČNÁ SPRÁVA KRÍZOVÉHO TÍMU</div><div class="stamp">PRÍPAD UZAVRETÝ</div><h1>Spoločným bodom bol automat na vodu v čakárni</h1><p>Pacient NULA: <b>pacient C</b>, zachytený o <b>19:25</b>.</p><div class="reportgrid"><div class="reportline">Osoba: pacient C</div><div class="reportline">Miesto: automat na vodu</div><div class="reportline">Čas: 19:25</div><div class="reportline">Dôkaz: kamera + vstup</div></div><div class="score">'+pct+' %</div><button class="btn" onclick="download()">Stiahnuť správu</button> <button class="ans danger" onclick="localStorage.removeItem(KEY);location.reload()">Nová hra</button></div>'}function modal(h,t,cb){let d=document.createElement('div');d.className='modal';d.innerHTML='<div><div class="ey">'+h+'</div><h2 class="cluebox">'+t+'</h2><button class="btn">Pokračovať</button></div>';document.body.appendChild(d);d.querySelector('button').onclick=()=>{d.remove();cb&&cb()}}render();</script></body></html>
